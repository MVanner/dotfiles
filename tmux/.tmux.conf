# =============================================================================
# PLUGINS (TPM) — keep plugin declarations at top
# =============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# =============================================================================
# GENERAL
# =============================================================================
set -a terminal-features "tmux-256color:RGB"

# Shell: every pane runs zsh as a login shell
set -g default-shell /bin/zsh
set -g default-command "exec /bin/zsh -l"
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mode-keys vi
set -g remain-on-exit off
set -g escape-time 0
set -g focus-events on
set -g extended-keys on

# Auto-name windows after running program (nvim, claude, ...).
# Claude Code's native binary reports its version (e.g. 2.1.3) as process name → map to "claude".
set -g automatic-rename on
set -g automatic-rename-format '#{?#{m:[0-9]*.[0-9]*.[0-9]*,#{pane_current_command}},claude,#{pane_current_command}}'

# =============================================================================
# THEME — minimal, transparent
# =============================================================================
# Status bar: transparent bg, plain window numbers left, [session] right
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#2e2e2e,fg=#8a8a8a"
set -g status-left ""
set -g status-right "#[fg=#a8a8a8][#S]"
set -g status-left-length 100
set -g status-right-length 100

# Windows: index only; current = boxed in red
set -g window-status-separator " "
set -g window-status-format "#[fg=#8a8a8a]#I"
set -g window-status-current-format "#[fg=#ffffff,bold]#I"
set -g window-status-activity-style "fg=#9a9a9a"
set -g window-status-bell-style "fg=#d70000"

# Pane borders: thin dashed grey, no colour difference for active pane
set -g pane-border-lines simple
set -g pane-border-style "fg=#4a4a4a"
set -g pane-active-border-style "fg=#6c6c6c"
set -g pane-border-indicators off

# Messages / copy mode / prompts
set -g message-style "bg=default,fg=#d0d0d0"
set -g message-command-style "bg=default,fg=#d0d0d0"
set -g mode-style "bg=#5f0f0f,fg=#e0e0e0"
set -g display-panes-colour "#4a4a4a"
set -g display-panes-active-colour "#d70000"
set -g clock-mode-colour "#d70000"

# =============================================================================
# KEYBINDINGS — splits open in current pane path
# =============================================================================
bind / split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind s new-window -c "#{pane_current_path}"

# Misc
bind b set -g status
bind x kill-pane
bind X kill-window
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Apps
bind G display-popup -E -w 90% -h 80% -d '#{pane_current_path}' -T 'lazygit' lazygit

# =============================================================================
# TPM INIT — must stay at very bottom
# =============================================================================
run '~/.tmux/plugins/tpm/tpm'
