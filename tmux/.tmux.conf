# =============================================================================
# PLUGINS (TPM) — keep plugin declarations at top
# =============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# =============================================================================
# GENERAL
# =============================================================================
set -a terminal-features "tmux-256color:RGB"
set -g prefix C-SPACE
unbind C-b
bind C-SPACE send-prefix

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mode-keys vi
set -g remain-on-exit off
set -g escape-time 0
set -g focus-events on
set -g extended-keys o

# =============================================================================
# CATPPUCCIN THEME
# =============================================================================
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# =============================================================================
# STATUS BAR
# =============================================================================
set -g status-position top
set -g status-interval 5
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_date_time}"
set -g status-left-length 100
set -g status-right-length 100
set -g status-justify absolute-centre

# =============================================================================
# SESSION PERSISTENCE
# =============================================================================
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-strategy-nvim 'session'

# =============================================================================
# KEYBINDINGS — splits open in current pane path
# =============================================================================
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Pane resize (with prefix, uppercase)
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Misc
bind b set -g status
bind x kill-pane
bind X kill-window
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Apps
bind G lazygit
bind e display-popup -E -w 80% -h 70% -d '#{pane_current_path}' -T 'Sesh' tv sesh
bind C display-popup -E -w 80% -h 70% -d '#{pane_current_path}' -T 'Claude' claude

# =============================================================================
# TPM INIT — must stay at very bottom
# =============================================================================
run '~/.tmux/plugins/tpm/tpm'
