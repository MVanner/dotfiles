# =============================================================================
# PLUGINS (TPM) — keep plugin declarations at top
# =============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# =============================================================================
# GENERAL
# =============================================================================
set -a terminal-features "tmux-256color:RGB"
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mode-keys vi
set -g remain-on-exit off
set -g escape-time 0
set -g focus-events on
set -g extended-keys o

# Auto-name windows after running program (nvim, claude, ...).
# Claude Code's native binary reports its version (e.g. 2.1.3) as process name → map to "claude".
set -g automatic-rename on
set -g automatic-rename-format '#{?#{m:[0-9]*.[0-9]*.[0-9]*,#{pane_current_command}},claude,#{pane_current_command}}'

# =============================================================================
# CATPPUCCIN THEME
# =============================================================================
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# =============================================================================
# STATUS BAR
# =============================================================================
set -g status-position bottom
set -g status-interval 5
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_date_time}"
set -g status-left-length 100
set -g status-right-length 100
set -g status-justify absolute-centre

# =============================================================================
# KEYBINDINGS — splits open in current pane path
# =============================================================================
bind / split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind s new-window 

# Misc
bind b set -g status
bind x kill-pane
bind X kill-window
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Apps
bind G display-popup -E -w 90% -h 80% -d '#{pane_current_path}' -T 'lazygit' lazygit

# =============================================================================
# TPM INIT — must stay at very bottom
# =============================================================================
run '~/.tmux/plugins/tpm/tpm'
