#general.import = ["~/.config/alacritty/catppuccin/catppuccin-mocha.toml"]
#general.live_config_reload = true

[env]
TERM = "xterm-256color"

[terminal.shell]
program = "/opt/homebrew/bin/tmux"
args = ["new-session", "-A", "-s", "main"]

[window]
decorations = "buttonless"
dynamic_padding = false
opacity = 0.8
blur = false

[window.padding]
x = 25
y = 20

[font]
size = 20.0

[font.bold]
family = "Hack Nerd Font"
style = "Heavy"

[font.bold_italic]
family = "Hack Nerd Font"
style = "Heavy Italic"

[font.italic]
family = "Hack Nerd Font"
style = "Medium Italic"

[font.normal]
family = "Hack Nerd Font"
style = "Regular"


